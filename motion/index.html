<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ojo Crítico | Apertura de motion graphics (HyperFrames)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0e14;color:#f4f1f4;font-family:Arial,Helvetica,sans-serif}#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse 900px 740px at 85% 18%,#4e1f35,transparent 85%),#101116}#root:after{position:absolute;content:'';inset:50px;border:1px solid #fff2;pointer-events:none}.accent{position:absolute;left:110px;top:105px;font-size:28px;font-weight:700;letter-spacing:8px;color:#ff6a7f}.wordmark{position:absolute;left:120px;top:265px;font-size:180px;line-height:.91;font-weight:900;letter-spacing:-10px;text-transform:uppercase}.wordmark span{color:#ff4b62}.rule{position:absolute;left:120px;top:710px;height:4px;width:1650px;background:#ff596b;transform-origin:left}.subtitle{position:absolute;left:120px;top:760px;font:italic 64px/1.25 Georgia,serif;color:#efd8dd}.label{position:absolute;right:150px;bottom:122px;letter-spacing:5px;font-size:24px;color:#d4b8c1}.halo{position:absolute;right:-185px;top:-200px;width:780px;height:780px;border:2px solid #ff5e7340;border-radius:50%;box-shadow:0 0 0 90px #ff5e7308,0 0 0 200px #ff5e7306}.foot{position:absolute;left:120px;bottom:115px;font-size:23px;letter-spacing:4px;color:#a9a6af}.clip{position:absolute;inset:0}.sr{position:absolute;bottom:22px;left:50px;font-size:18px;color:#9694a0}
</style>
</head>
<body>
<div id="root" data-composition-id="ojo-critico-intro" data-start="0" data-duration="8" data-width="1920" data-height="1080">
<section class="clip" data-start="0" data-duration="8" data-track-index="0" aria-label="Introducción del especial">
<div class="halo" id="halo"></div>
<div class="accent" id="topline">ESPECIAL INTERACTIVO · LIMA 2026</div>
<div class="wordmark" id="title">OJO<br><span>CRÍTICO.</span></div>
<div class="rule" id="rule"></div>
<div class="subtitle" id="subtitle">Mirar de frente lo que otros callan</div>
<div class="foot" id="foot">HISTORIAS  /  ENTREVISTAS  /  DATOS</div>
<div class="label" id="label">PERIODISMO QUE PREGUNTA</div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
// Composition contract taken from the public HyperFrames documentation.
// The timed GSAP sequence is seekable and suitable for HyperFrames CLI rendering.
window.__timelines=window.__timelines||{};
if(window.gsap){
const tl=gsap.timeline({paused:true});
tl.fromTo('#halo',{scale:.75,opacity:0},{scale:1.12,opacity:1,duration:2.6,ease:'power2.out'},0)
  .from('#topline',{y:-30,opacity:0,duration:.65,ease:'power3.out'},.3)
  .from('#title',{y:130,opacity:0,duration:1.2,ease:'power4.out'},.6)
  .from('#rule',{scaleX:0,duration:.9,ease:'power3.inOut'},1.35)
  .from('#subtitle',{y:35,opacity:0,duration:1.0,ease:'power3.out'},1.75)
  .from('#foot',{opacity:0,y:20,duration:.8},2.7)
  .from('#label',{opacity:0,x:60,duration:.9},3.1)
  .to('#title',{x:14,duration:2.1,ease:'sine.inOut'},4.5)
  .to('#halo',{scale:1.3,duration:3,ease:'sine.out'},4.7)
  .to('#title,#topline,#subtitle,#foot,#label,#rule',{opacity:0,duration:.8},7.1);
window.__timelines['ojo-critico-intro']=tl;
} else {document.body.insertAdjacentHTML('beforeend','<p class="sr">Vista estática disponible. Para la animación instala GSAP / ejecuta HyperFrames.</p>')}
</script>
</body>
</html>
